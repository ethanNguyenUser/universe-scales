dimension: counts
base_unit: count
dimension_description: 'Counts are dimensionless tallies of discrete things or discrete possibilities: planets, genes, cells, books, stars, IPv6 addresses, or legal game states. Mixing literal inventories with combinatorial possibility spaces would be misleading if that distinction were hidden, so each entry says what is being counted. This scale is useful for comparing everyday finite sets with astronomical and computationally explosive counts on one logarithmic axis.'
related_resources:
- name: Counting
  url: https://en.wikipedia.org/wiki/Counting
- name: Order of magnitude (numbers)
  url: https://en.wikipedia.org/wiki/Orders_of_magnitude_(numbers)
show_limitations: true
units:
- conversion_factor: 1.0
  description: A count is the canonical storage unit for dimensionless tallies of discrete items or states.
  name: count
  symbol: count
- name: thousands
  symbol: k
  conversion_factor: 0.001
  description: Thousands are useful for populations, words, and other everyday counts.
- name: millions
  symbol: M
  conversion_factor: 1.0e-06
  description: Millions are useful for genomes, screens, and small-scale populations.
- name: billions
  symbol: B
  conversion_factor: 1.0e-09
  description: Billions are useful for human-scale civilization totals.
- name: trillions
  symbol: T
  conversion_factor: 1.0e-12
  description: Trillions are useful for cells, synapses, and large inventories.
- name: quadrillions
  symbol: Qa
  conversion_factor: 1.0e-15
  description: Quadrillions help with large state spaces and biological counts.
- name: quintillions
  symbol: Qi
  conversion_factor: 1.0e-18
  description: Quintillions help with cryptographic and combinatorial state counts.
- name: sextillions
  symbol: Sx
  conversion_factor: 1.0e-21
  description: Sextillions help compare molecular and astronomical counts.
- name: septillions
  symbol: Sp
  conversion_factor: 1.0e-24
  description: Septillions are useful for very large molecular and atomic tallies.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: society
frontend_group_label: Society, Economy & Abstract Quantities
frontend_order: 380
