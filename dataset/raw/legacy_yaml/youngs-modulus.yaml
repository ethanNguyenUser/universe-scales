base_unit: pascals
dimension: youngs-modulus
dimension_description: Youngs modulus describes linear elastic stiffness, the ratio of stress to strain for small reversible deformations. It is the slope of the initial part of a stress strain curve under uniaxial load at stated temperature and rate. Microstructure, porosity, and moisture can shift it dramatically for natural materials. Each value below includes a representative condition so comparisons hold water.
items:
- description: Soft rubber stores little energy per strain because chains uncoil easily, leading to a very low modulus. As strain rises, entropic elasticity stiffens the response. Fillers like carbon black raise the modulus by reinforcing the network. The value given is for an unfilled gum rubber at room temperature.
  name: Rubber
  source: https://en.wikipedia.org/wiki/Rubber
  value: 1e6
- description: Polymer foams behave like springs in a scaffold of cells, so their effective modulus is tiny until densification. Cell size, gas content, and skin layers matter as much as chemistry. Designers tune this for pillows versus helmet liners. The value is for a flexible open cell foam in small strain compression.
  name: Foam
  source: https://en.wikipedia.org/wiki/Foam
  value: 1e5
- description: Softwoods are anisotropic; along the grain the modulus is moderate, across the grain it is an order lower. Moisture acts like a plasticizer that reduces stiffness. Builders season wood to stabilize this property. The value is longitudinal for dried spruce.
  name: Wood (Soft)
  source: https://en.wikipedia.org/wiki/Wood
  value: 1e9
- description: Cartilage combines a collagen network with pressurized water to form a poroelastic material with low instantaneous modulus. Under sustained load the modulus rises as fluid drains. Healthy joints depend on this time dependence for shock absorption. The value is an initial small strain tangent.
  name: Cartilage
  source: https://en.wikipedia.org/wiki/Cartilage
  value: 1e6
- description: Cortical bone has a modulus in the tens of gigapascals along the osteon direction due to mineralized collagen. Age and disease reduce both stiffness and toughness. Implant designers choose alloys to match this to avoid stress shielding. The value is for human femoral cortical bone in tension.
  name: Bone
  source: https://en.wikipedia.org/wiki/Bone
  value: 2e10
- description: Tendon stores elastic energy for locomotion with a modulus around a gigapascal that rises with strain. Warm tissues display higher extensibility and lower stiffness initially. Training induces remodeling that tunes this property. The figure is a small strain slope for Achilles tendon.
  name: Tendon
  source: https://en.wikipedia.org/wiki/Tendon
  value: 1e9
- description: Aluminum alloys share a modulus near seventy gigapascals regardless of strength grade because stiffness depends on bonding, not microstructure alone. This constancy simplifies deflection calculations. Temperature reduces modulus slightly. The value is for a typical wrought alloy.
  name: Aluminum
  source: https://en.wikipedia.org/wiki/Aluminium
  value: 7e10
- description: Steels cluster near two hundred gigapascals in modulus across many alloys and tempers. Heat treatment alters yield and toughness but not this slope much. That is why beams deflect similarly before yield regardless of grade. The value is the canonical handbook number.
  name: Steel
  source: https://en.wikipedia.org/wiki/Steel
  value: 2e11
- description: Titanium alloys are roughly half as stiff as steel at similar densities, giving good specific stiffness. Designers exploit this for weight sensitive parts that must flex without yielding. Temperature and phase mix set exact values. The number is for Ti 6Al 4V.
  name: Titanium
  source: https://en.wikipedia.org/wiki/Titanium
  value: 1.1e11
- description: Concrete’s modulus depends on aggregate and curing; it is not a pure material constant. Codes use empirical formulas tied to compressive strength. Long term creep lowers effective stiffness in service. The value is a short term tangent for a structural mix.
  name: Concrete
  source: https://en.wikipedia.org/wiki/Concrete
  value: 3e10
- description: Glass is relatively stiff with a modulus similar to some metals despite brittleness. Defects control strength but not this initial slope. Temperature near the glass transition softens it dramatically. The value is for soda lime glass at room temperature.
  name: Glass
  source: https://en.wikipedia.org/wiki/Glass
  value: 7e10
- description: Engineering ceramics achieve very high modulus due to strong ionic and covalent bonds. Their stiffness remains high even at heat where metals soften. Designers trade brittleness against this stiffness for cutting tools. The value is for alumina.
  name: Ceramic
  source: https://en.wikipedia.org/wiki/Ceramic
  value: 3e11
- description: Unidirectional carbon fiber composites have an effective modulus near two hundred gigapascals along the fiber direction, while transverse is far lower. Rule of mixtures gives a first estimate based on fiber volume. Layup choices tailor stiffness to load paths. The number is for a high modulus fiber epoxy lamina.
  name: Carbon Fiber
  source: https://en.wikipedia.org/wiki/Carbon_fiber
  value: 2e11
- description: Diamond is among the stiffest known solids because of its dense sp3 network. Small strains store huge elastic energy before fracture. Microelectromechanical resonators exploit this for high frequency stability. The value is a polycrystalline average.
  name: Diamond
  source: https://en.wikipedia.org/wiki/Diamond
  value: 1e12
- description: Graphene’s in plane modulus approaches the theoretical limit for a two dimensional lattice. Out of plane bending is much softer, illustrating geometric effects. Large area films reduce modulus due to wrinkles and defects. The value is from nanoindentation on monolayers.
  name: Graphene
  source: https://en.wikipedia.org/wiki/Graphene
  value: 1e12
- description: The crust of a neutron star has a colossal effective shear modulus in models, reflecting interactions in a dense nuclear lattice. Starquakes excite oscillations that encode this stiffness indirectly. Laboratory analogies are qualitative at best. The value is an estimate from astrophysical constraints.
  name: Neutron Star Crust
  source: https://en.wikipedia.org/wiki/Neutron_star
  value: 1e30
- description: Near a black hole horizon, describing spacetime response with an effective modulus is metaphorical yet useful for order of magnitude. Accretion disk magneto turbulence sets stress strain like relations for the fluid. These ideas guide simulations of jets and spectra. The number is a heuristic extreme for comparison.
  name: Black Hole Horizon
  source: https://en.wikipedia.org/wiki/Black_hole
  value: 1e35
- description: >-
    Silica aerogel is often called solid smoke because its density is so low and its stiffness is only modestly above that of soft foams. Even so, it is a true solid with a measurable elastic slope that matters in insulation panels and particle collectors. Large strains quickly move it beyond the small-strain regime. The value is a representative low-density aerogel modulus.
  name: Silica Aerogel
  source: https://en.wikipedia.org/wiki/Aerogel
  value: 1e7
- description: >-
    Cork compresses easily at first because gas-filled cells collapse and recover, which is why it works so well as a bottle stopper and vibration isolator. Its modulus is far above a liquid but far below wood or plastic. Moisture and direction both matter because the cell structure is anisotropic. The value is a representative small-strain modulus.
  name: Cork
  source: https://en.wikipedia.org/wiki/Cork_(material)
  value: 2e7
- description: >-
    Polyethylene is flexible because its elastic modulus is only a few hundred megapascals, several hundred times lower than common metals. That makes it ideal for bottles, cutting boards, and films that need to bend without cracking. Crystallinity shifts the stiffness a bit but not the basic scale. The value is representative for HDPE.
  name: Polyethylene
  source: https://en.wikipedia.org/wiki/Polyethylene
  value: 2e8
- description: >-
    ABS plastic is noticeably stiffer than polyethylene but still far softer than metals, which is why product housings feel solid while retaining some impact tolerance. Engineers like this middle ground for consumer goods and machine covers. The modulus depends on temperature and whether the part is molded or printed. The value is a common handbook figure.
  name: ABS Plastic
  source: https://en.wikipedia.org/wiki/Acrylonitrile_butadiene_styrene
  value: 2e9
- description: >-
    PLA prints feel rigid because their elastic modulus reaches a few gigapascals, substantially above many household plastics. That helps small printed parts keep shape, though it does not guarantee toughness. Temperature softening remains the main weakness. The number is a representative modulus for solid PLA.
  name: PLA Plastic
  source: https://en.wikipedia.org/wiki/Polylactic_acid
  value: 3.5e9
- description: >-
    Water ice is much less stiff than rock or metal but far stiffer than rubber, which is why glaciers can support cracks and transmit seismic waves even while creeping over years. Planetary scientists rely on this modulus when modeling icy moons and ice shelves. Temperature shifts it meaningfully. The value is a typical terrestrial ice modulus.
  name: Ice
  source: https://en.wikipedia.org/wiki/Ice
  value: 9e9
- description: >-
    Spider dragline silk stretches more than most engineering fibers, but its modulus still lands around tens of gigapascals, high enough to store useful elastic energy in a light thread. Biologists care because that balance of stiffness and toughness is rare in natural materials. Humidity changes the feel quickly. The value is a representative dry-fiber modulus.
  name: Spider Silk
  source: https://en.wikipedia.org/wiki/Spider_silk
  value: 1e10
- description: >-
    Common fired brick behaves like a stiff brittle ceramic composite on small elastic strains. Masonry design often treats whole walls rather than brick alone, but the brick material itself lives in the low tens of gigapascals. That is enough to keep arches and facades from sagging visibly under ordinary loads. The value is a representative engineering brick modulus.
  name: Brick
  source: https://en.wikipedia.org/wiki/Brick
  value: 1.5e10
- description: >-
    Lead is soft in yield strength but not infinitely floppy: its elastic modulus still sits in the tens of gigapascals. That is why lead pipes and sheets can hold shape until creep and plasticity take over. The contrast between low modulus metals and high modulus ceramics is one of the simplest material lessons to feel by hand. The value is a standard handbook number.
  name: Lead
  source: https://en.wikipedia.org/wiki/Lead
  value: 1.6e10
- description: >-
    Bamboo is a natural fiber composite whose stiffness along the grain can rival some structural timbers and low-end engineering materials. Its geometry makes it especially effective for lightweight columns and scaffolds. Across the grain the modulus is far lower, so direction matters. The number is an along-fiber representative value.
  name: Bamboo
  source: https://en.wikipedia.org/wiki/Bamboo
  value: 2e10
- description: >-
    Magnesium alloys are attractive in vehicles and aircraft because their stiffness is lower than aluminum’s but their density is lower too. That means components can still achieve respectable specific stiffness when geometry is optimized. Corrosion protection and fatigue remain important design constraints. The value is a representative modulus for structural magnesium alloys.
  name: Magnesium Alloy
  source: https://en.wikipedia.org/wiki/Magnesium_alloy
  value: 4.5e10
- description: >-
    Kevlar fibers are less stiff than carbon fibers but still very much engineering fibers, landing around tens of gigapascals in axial modulus. Their real advantage is the combination of stiffness, toughness, and low density. Ballistic fabrics and ropes turn that combination into practical products. The value is a representative fiber-direction modulus.
  name: Kevlar Fiber
  source: https://en.wikipedia.org/wiki/Kevlar
  value: 8e10
- description: >-
    Brass is mechanically between aluminum and steel in stiffness, which is why instruments, fittings, and decorative hardware feel dense and solid without becoming especially springy. Composition changes the exact number, but not by an order of magnitude. Machinists value the consistency this implies. The value is a representative modulus for cartridge brass.
  name: Brass
  source: https://en.wikipedia.org/wiki/Brass
  value: 1e11
- description: >-
    Copper combines excellent electrical conduction with a modulus a bit above one hundred gigapascals, enough to make busbars and springs hold form while still yielding more readily than steels. Purity and cold work change strength much more than stiffness. That separation is why electrical and mechanical design tables both matter. The value is a representative modulus for bulk copper.
  name: Copper
  source: https://en.wikipedia.org/wiki/Copper
  value: 1.2e11
- description: >-
    Crystalline silicon is the structural backbone of chips and MEMS, and its modulus is high enough that tiny beams and resonators can ring at precise frequencies. The exact value depends on crystal direction because the lattice is anisotropic. Semiconductor fabrication treats this as a design parameter, not trivia. The number is a representative orientation-averaged modulus.
  name: Silicon
  source: https://en.wikipedia.org/wiki/Silicon
  value: 1.3e11
- description: >-
    Tungsten is one of the stiffest practical metals, which is why it holds shape at heat and finds use in filaments, weights, and tooling. Its density is famous, but the high modulus is just as important in applications that need resistance to elastic bending. Brittleness is the tradeoff. The value is a representative room-temperature modulus.
  name: Tungsten
  source: https://en.wikipedia.org/wiki/Tungsten
  value: 4.1e11
- description: >-
    Silicon carbide combines ceramic hardness with very high elastic stiffness, making it valuable for armor, abrasives, mirrors, and high-temperature components. Components made from it resist small elastic strain strongly before brittle failure becomes the real limit. It is a good reminder that stiffness and toughness are separate traits. The value is a representative engineering modulus.
  name: Silicon Carbide
  source: https://en.wikipedia.org/wiki/Silicon_carbide
  value: 4.5e11
- description: >-
    Nylon sits in the low-gigapascal range, stiff enough for gears, fasteners, and bushings yet compliant enough to damp shock and noise. Moisture softens it because water acts as a plasticizer in the polymer network. That is why dry and conditioned values can differ noticeably in datasheets. The value is a representative small-strain modulus for nylon 6.
  name: Nylon
  source: https://en.wikipedia.org/wiki/Nylon
  value: 2.5e9
- description: >-
    Hardwoods like oak are stiffer than many softwoods because of their denser microstructure and higher latewood fraction. Furniture makers and structural engineers both feel this directly in how little a board flexes under load. Grain direction still dominates the number, so this is an along-grain figure. The value is a representative modulus for oak.
  name: Oak
  source: https://en.wikipedia.org/wiki/Oak
  value: 1.2e10
units:
- conversion_factor: 1
  description: Pascals are the base unit for elastic modulus, connecting stress and strain directly. Reporting in pascals keeps comparisons across metals, polymers, and tissues coherent. Engineers often translate to gigapascals for brevity. All item values are stored in pascals before conversion.
  name: pascals
  symbol: Pa
- conversion_factor: 1e-9
  description: Gigapascals compress the large numbers typical of stiffness into two or three digits. Most structural materials live between one and three hundred gigapascals. Using GPa matches handbooks and FEA software defaults. Convert by multiplying pascals by 1e-9.
  name: gigapascals
  symbol: GPa
- conversion_factor: 1e-6
  description: Megapascals are useful when discussing softer materials like polymers, tissues, and foams. They align with biomedical and consumer product literature. Conversions from pascals are linear and exact. The unit bridges daily lab work with engineering design.
  name: megapascals
  symbol: MPa
