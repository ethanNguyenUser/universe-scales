dimension: density
base_unit: kilograms_per_cubic_meter
dimension_description: Density is mass per unit volume under stated composition, temperature, and pressure assumptions. Most entries below are bulk average densities rather than microscopic local densities, and extreme astrophysical entries are explicitly marked when they refer to stellar cores or degenerate matter.
related_resources:
- name: Wikidata density property
  url: https://www.wikidata.org/wiki/Property:P2054
- name: Density
  url: https://en.wikipedia.org/wiki/Density
show_limitations: true
units:
- conversion_factor: 1.0
  description: Kilograms per cubic meter are the canonical storage unit for density.
  name: kilograms per cubic meter
  symbol: kg/m^3
- conversion_factor: 0.001
  description: Grams per cubic centimeter are common in chemistry and materials science.
  name: grams per cubic centimeter
  symbol: g/cm^3
- name: kilograms per liter
  symbol: kg/L
  conversion_factor: 0.001
  description: Kilograms per liter are intuitive for liquids and bulk materials.
- name: pounds per cubic foot
  symbol: lb/ft^3
  conversion_factor: 0.0624279605761
  description: Pounds per cubic foot are common in construction and fluid handling.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
frontend_group: materials
frontend_group_label: Materials & Matter
frontend_order: 140
