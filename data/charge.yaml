dimension: charge
base_unit: coulombs
dimension_description: Electric charge measures how much net positive or negative charge a system carries. Some entries are direct physical charges like the elementary charge, while others are derived from capacities, battery ratings, or stored-energy assumptions. This dimension is useful for connecting microscopic charges, static electricity, capacitors, storms, and batteries on one logarithmic axis.
related_resources:
- name: Electric charge
  url: https://en.wikipedia.org/wiki/Electric_charge
- name: Coulomb
  url: https://en.wikipedia.org/wiki/Coulomb
show_limitations: true
units:
- conversion_factor: 1.0
  description: Coulombs are the canonical storage unit for electric charge.
  name: coulombs
  symbol: C
- name: elementary charges
  symbol: e
  conversion_factor: 6.2415090744608e+18
  description: Elementary charges make microscopic charge counts intuitive.
- name: microcoulombs
  symbol: uC
  conversion_factor: 1000000.0
  description: Microcoulombs are useful for static electricity and small capacitors.
- name: millicoulombs
  symbol: mC
  conversion_factor: 1000.0
  description: Millicoulombs are useful for larger capacitors and discharge events.
- name: kilocoulombs
  symbol: kC
  conversion_factor: 0.001
  description: Kilocoulombs are useful for batteries and large electrical systems.
- name: ampere-hours
  symbol: Ah
  conversion_factor: 0.0002777777777778
  description: Ampere-hours are the familiar battery-capacity unit for large stored charge.
- name: milliampere-hours
  symbol: mAh
  conversion_factor: 0.2777777777778
  description: Milliampere-hours are useful for small batteries and portable electronics.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
