dimension: area
base_unit: square_meters
dimension_description: Area here means a characteristic area under explicit qualifiers, often a surface area, cross-section, footprint, or geographic extent. Mixing those notions blindly would be misleading, so each entry states what kind of area is being used. The point is coverage across scales, not a claim that all areas answer the same question.
related_resources:
- name: Wikidata area property
  url: https://www.wikidata.org/wiki/Property:P2046
- name: Area
  url: https://en.wikipedia.org/wiki/Area
show_limitations: true
units:
- conversion_factor: 1.0
  description: Square meters are the canonical storage unit for all area observations.
  name: square meters
  symbol: m^2
- conversion_factor: 10000.0
  description: Square centimeters are useful for small surfaces and cross-sections.
  name: square centimeters
  symbol: cm^2
- conversion_factor: 1.0e-06
  description: Square kilometers are useful for geography and astronomy.
  name: square kilometers
  symbol: km^2
- conversion_factor: 0.0001
  description: Hectares are common for land area and agriculture.
  name: hectares
  symbol: ha
- conversion_factor: 0.000247105
  description: Acres are widely used in land records and real estate.
  name: acres
  symbol: ac
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
