dimension: flops
base_unit: flops
dimension_description: This scale treats FLOPs pragmatically as floating-point operations per second, the throughput measure most people mean when they compare processors, GPUs, and supercomputers. It mixes direct published device specs with reference magnitudes like gigaflops, teraflops, and exaflops. Precision mode matters in real hardware, so the notes are representative rather than exhaustive.
related_resources:
- name: FLOPS
  url: https://en.wikipedia.org/wiki/FLOPS
- name: Supercomputer performance
  url: https://en.wikipedia.org/wiki/Supercomputer#Performance
show_limitations: true
units:
- name: floating-point operations per second
  symbol: FLOP/s
  conversion_factor: 1.0
  description: Floating-point operations per second are the canonical storage unit for this throughput scale.
- name: megaflops
  symbol: MFLOP/s
  conversion_factor: 1.0e-06
  description: Megaflops are useful for older computers and small embedded devices.
- name: gigaflops
  symbol: GFLOP/s
  conversion_factor: 1.0e-09
  description: Gigaflops are useful for CPUs and smaller accelerators.
- name: teraflops
  symbol: TFLOP/s
  conversion_factor: 1.0e-12
  description: Teraflops are useful for modern GPUs and consoles.
- name: petaflops
  symbol: PFLOP/s
  conversion_factor: 1.0e-15
  description: Petaflops are useful for large clusters and supercomputers.
- name: exaflops
  symbol: EFLOP/s
  conversion_factor: 1.0e-18
  description: Exaflops are useful for the largest contemporary supercomputers.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: information
frontend_group_label: Information & Computation
frontend_order: 470
