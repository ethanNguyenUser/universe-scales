dimension: surface-tension
base_unit: newtons_per_meter
dimension_description: Surface tension is the energetic cost of creating more liquid surface, usually expressed as force per unit length. It is highly sensitive to temperature and contaminants, so these are representative values rather than immutable constants. This scale is useful for comparing cryogenic fluids, common liquids, and unusual high-tension metals.
related_resources:
- name: Surface tension
  url: https://en.wikipedia.org/wiki/Surface_tension
show_limitations: true
units:
- name: newtons per meter
  symbol: N/m
  conversion_factor: 1.0
  description: Newtons per meter are the canonical storage unit for surface tension.
- name: millinewtons per meter
  symbol: mN/m
  conversion_factor: 1000.0
  description: Common lab and materials unit.
- name: micronewtons per meter
  symbol: uN/m
  conversion_factor: 1000000.0
  description: Useful for very low surface tensions.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: materials
frontend_group_label: Materials & Matter
frontend_order: 260
